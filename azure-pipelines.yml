trigger: none

parameters:
- name: language
  displayName: Software Stack
  type: string
  default: python
  values:
    - python
    - java

- name: target_ip
  displayName: Target VM IP
  type: string
  default: ""

- name: vm_user
  displayName: VM Username
  type: string
  default: ""

pool:
  name: ansiblepool

# VM_PASSWORD must be created as a Secret Variable in Azure DevOps
# (Pipeline -> Edit -> Variables -> lock icon). Do NOT hardcode it here.

steps:
- checkout: self

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.x'

- script: |
    python -m pip install --upgrade pip
    pip install ansible
    sudo apt-get update
    sudo apt-get install -y sshpass
  displayName: Install Ansible

- script: |
    cat > inventory.ini <<EOF
    [linux]
    target ansible_host=${{ parameters.target_ip }}

    [linux:vars]
    ansible_user=${{ parameters.vm_user }}
    ansible_connection=ssh
    ansible_python_interpreter=/usr/bin/python3
    EOF

    cat inventory.ini
  displayName: Create Inventory

- script: |
    ansible-playbook -i inventory.ini install_stack.yml \
      -e "language=${{ parameters.language }}" \
      -e "ansible_password=$ANSIBLE_PASSWORD"
  displayName: Run Playbook
  env:
    ANSIBLE_PASSWORD: $(VM_PASSWORD)