trigger: none

parameters:
- name: language
  displayName: Software Stack
  type: string
  default: python
  values:
    - python
    - java

pool:
  name: ansiblepool

variables:
- name: TARGET_IP
  value: ""

- name: VM_USER
  value: ""

# Create VM_PASSWORD as a Secret Variable in Azure DevOps
# Do NOT hardcode the password here.

steps:
- checkout: self


- script: |
    python -m pip install --upgrade pip
    pip install ansible
    sudo apt-get update
    sudo apt-get install -y sshpass
  displayName: Install Ansible

- script: |
    cat > inventory.ini <<EOF
    [linux]
    target ansible_host=$(TARGET_IP)

    [linux:vars]
    ansible_user=$(VM_USER)
    ansible_connection=ssh
    ansible_python_interpreter=/usr/bin/python3
    EOF

    cat inventory.ini
  displayName: Create Inventory

- script: |
    ansible-playbook install_stack.yml \
      -e "language=${{ parameters.language }}" \
      -e "ansible_password=$(VM_PASSWORD)"
  displayName: Run Playbook